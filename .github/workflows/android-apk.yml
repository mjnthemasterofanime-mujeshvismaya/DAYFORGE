name: Build DAYFORGE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prepare website assets
        run: |
          mkdir -p www
          cp index.html app.js database.js notifications.js views.js sheets.js utils.js style.css themes.css responsive.css manifest.json icon.svg icon-192.png icon-512.png service-worker.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/DAYFORGE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYFORGE-Android-APK
          path: build-output/DAYFORGE.apk
          retention-days: 30
